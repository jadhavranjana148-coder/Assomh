<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png" />
<title>Owner Access</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
overflow:hidden;
}

.container{
text-align:center;
animation:fadeIn 1s ease;
}

img{
max-width:90vw;
max-height:80vh;
border-radius:20px;
box-shadow:0 0 30px #00bfff;
}

h1{
color:#00bfff;
margin-bottom:20px;
font-size:32px;
}

p{
color:white;
margin-top:15px;
font-size:18px;
}

@keyframes fadeIn{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

</style>
</head>
<body>

<div class="container">

<h1>Access Granted</h1>

<img src="asmita.png" alt="Soham">

<p>Welcome Owner</p>

</div>

</body>
</html>
