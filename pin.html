
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIN Lock</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:100%;
max-width:400px;
padding:20px;
text-align:center;
}

h2{
margin-bottom:25px;
}

.pin-display{
width:100%;
height:60px;
border:2px solid #444;
border-radius:15px;
margin-bottom:25px;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
letter-spacing:10px;
background:#111;
}

.keypad{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.btn{
height:75px;
border:none;
border-radius:20px;
background:#1a1a1a;
color:white;
font-size:28px;
cursor:pointer;
transition:.2s;
}

.btn:active{
transform:scale(.95);
}

.success{
background:#00bfff !important;
}

.error{
background:red !important;
}

.check{
background:#00aa44;
}

.empty{
visibility:hidden;
}

</style>
</head>
<body>

<div class="container">

<h2>Enter PIN</h2>

<div class="pin-display" id="display"></div>

<div class="keypad">

<button class="btn" onclick="addNum('1')">1</button>
<button class="btn" onclick="addNum('2')">2</button>
<button class="btn" onclick="addNum('3')">3</button>

<button class="btn" onclick="addNum('4')">4</button>
<button class="btn" onclick="addNum('5')">5</button>
<button class="btn" onclick="addNum('6')">6</button>

<button class="btn" onclick="addNum('7')">7</button>
<button class="btn" onclick="addNum('8')">8</button>
<button class="btn" onclick="addNum('9')">9</button>

<button class="btn empty"></button>
<button class="btn" onclick="addNum('0')">0</button>
<button class="btn check" onclick="checkPin()">✔</button>

</div>

</div>

<script>

const CORRECT_PIN = "2132012";

let enteredPin = "";

const display =
document.getElementById("display");

function updateDisplay(){

display.innerHTML =
"●".repeat(enteredPin.length);

}

function addNum(num){

if(enteredPin.length >= 7)
return;

enteredPin += num;

updateDisplay();

}

function checkPin(){

if(enteredPin === CORRECT_PIN){

display.classList.remove("error");
display.classList.add("success");

setTimeout(()=>{

window.location.href =
"key.html";

},800);

}
else{

display.classList.add("error");

navigator.vibrate?.(200);

setTimeout(()=>{

display.classList.remove("error");

enteredPin = "";

updateDisplay();

},1000);

}

}

</script>

</body>
</html>
